name: korpus-audit

on:
  push:
    paths:
      - "anna/src/piii/**"
      - "tools/korpus_audit.py"
  pull_request:
    paths:
      - "anna/src/piii/**"
  schedule:
    - cron: "0 3 1 */3 *" # Kuartalan: jam 3 pagi tanggal 1 tiap 3 bulan

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Audit Korpus Psikoedukasi
        run: python tools/korpus_audit.py
      - name: Ban Deprecated LangChain Constructs
        run: python tools/ban_deprecated.py
