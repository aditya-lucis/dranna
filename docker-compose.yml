version: "3.8"

services:
  dranna-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dranna-companion-api
    ports:
      - "8080:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - OPENBLAS_NUM_THREADS=1
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    volumes:
      - ./web:/app/web
      - ./anna:/app/anna
      - ./assets:/app/assets
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
